name: Run Renovate

on:
  schedule:
    - cron: "0 6 * * *" 
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      - name: Install Renovate
        run: npm install -g renovate

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_ALLOWED_COMMANDS: "bash .github/sync-chart-version.sh"
          GH_TOKEN: ${{ github.token }}
        run: |
          last_merge() { gh pr list --repo loeken/helm-charts --state merged --limit 1 --json mergedAt --jq '.[0].mergedAt // "none"'; }
          prev_ts=$(last_merge)
          for i in 1 2 3 4 5; do
            renovate loeken/helm-charts
            cur_ts=$(last_merge)
            if [ "$cur_ts" = "$prev_ts" ]; then
              echo "No new merges in iteration $i; done"
              break
            fi
            echo "Merge detected in iteration $i; re-running Renovate to drain remaining PRs"
            prev_ts=$cur_ts
          done
